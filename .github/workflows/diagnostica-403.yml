name: Diagnostica 403 MIM

# Temporaneo, vive solo su questo branch: gira al push per capire come il sito
# MIM sta bloccando i runner GitHub. Non tocca Telegram ne' lo stato.
on:
  push:
    branches:
      - claude/usr-campania-scraper-debug-rrbjn3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa gli strumenti di prova
        run: pip install requests

      - name: Cerca una via d'accesso
        run: |
          cat > probe2.py <<'PY'
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36")
          PATTERN = "/web/miur-usr-campania/-/"

          def prova(nome, url, headers=None):
              try:
                  r = requests.get(url, headers={"User-Agent": UA, **(headers or {})},
                                   timeout=45, allow_redirects=True)
                  t = r.text or ""
                  n = t.count(PATTERN)
                  akamai = r.headers.get("Server", "")
                  print(f"{nome:<52} {r.status_code:>4}  len={len(t):>7}  "
                        f"link={n:>3}  server={akamai}  url={r.url[:70]}")
                  return r.status_code, n, t
              except Exception as e:
                  print(f"{nome:<52}  ERR  {type(e).__name__}: {str(e)[:70]}")
                  return 0, 0, ""

          print("\n--- 1. Ampiezza del blocco sul dominio MIM ---")
          prova("mim.gov.it robots.txt", "https://www.mim.gov.it/robots.txt")
          prova("mim.gov.it homepage", "https://www.mim.gov.it/")
          prova("mim.gov.it senza www", "https://mim.gov.it/")
          prova("miur.gov.it (vecchio dominio)", "https://www.miur.gov.it/web/miur-usr-campania/notizie")
          prova("istruzione.it (vecchio dominio)", "https://www.istruzione.it/web/miur-usr-campania/notizie")

          print("\n--- 2. Possibili RSS ufficiali Liferay ---")
          for p in ("/web/miur-usr-campania/rss",
                    "/rss/-/asset_publisher/rss",
                    "/web/miur-usr-campania/notizie?p_p_id=101&p_p_lifecycle=2&p_p_resource_id=rss"):
              prova(f"  {p[:46]}", "https://www.mim.gov.it" + p)

          print("\n--- 3. Relay di lettura di terze parti ---")
          TARGET = "https://www.mim.gov.it/web/miur-usr-campania/notizie"
          st, n, t = prova("r.jina.ai", "https://r.jina.ai/" + TARGET)
          if st == 200:
              print("    estratto r.jina.ai: " + " ".join(t[:400].split()))
          prova("allorigins raw", "https://api.allorigins.win/raw?url=" + TARGET)
          prova("codetabs", "https://api.codetabs.com/v1/proxy?quest=" + TARGET)

          print("\n--- 4. Cache pubbliche ---")
          prova("Bing cache ricerca", "https://www.bing.com/search?q=site%3Amim.gov.it+miur-usr-campania+notizie")
          PY
          python probe2.py
