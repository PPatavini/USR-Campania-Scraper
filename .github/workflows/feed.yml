name: Aggiorna feed USR Campania

on:
  workflow_dispatch:
    inputs:
      resend_last:
        description: "Rimanda su Telegram gli ultimi N avvisi gia' inviati (0 = nessuno)"
        required: false
        default: "0"

permissions:
  contents: write   # serve per salvare state/seen.json
  pages: write
  id-token: write

# Un solo run per volta. 'cancel-in-progress: true' e' la parte importante:
# se un run resta incastrato (a fine luglio 2026 uno e' rimasto in stato
# "waiting" sull'ambiente github-pages per giorni), quello successivo lo annulla
# e prosegue. Con 'false' i run si accodavano e venivano annullati a catena
# senza mai partire, e il canale Telegram restava muto senza segnalare errori.
concurrency:
  group: usr-campania-feed
  cancel-in-progress: true

jobs:
  # Un solo job, di proposito. Tenere il deploy su Pages in un job separato
  # raddoppiava le macchine da chiedere a GitHub a ogni giro, e il 6 agosto 2026
  # e' stato proprio questo il punto debole: per ore i job restavano in coda
  # senza che venisse assegnato un runner. Meno runner si chiedono, meno spesso
  # capita. Le notifiche restano comunque protette dai problemi di Pages perche'
  # i passi di pubblicazione stanno in fondo e sono 'continue-on-error'.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed (+ Telegram se configurato)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_LAST: ${{ inputs.resend_last }}
        run: python scraper.py

      - name: Salva lo stato degli avvisi inviati
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "Nessun nuovo avviso da registrare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Aggiorna stato avvisi inviati [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Da qui in giu' e' tutta pubblicazione su Pages. A questo punto gli avvisi
      # sono gia' partiti su Telegram e lo stato e' gia' committato, quindi un
      # intoppo di Pages non deve far fallire il run: servirebbe solo a mandare
      # una mail di errore per un feed che viene ripubblicato 15 minuti dopo.
      # 'continue-on-error' va messo sui singoli passi: a livello di job non
      # basta, il run risulta 'failure' lo stesso (verificato sul run 2711).
      - name: Configura Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Carica la cartella docs
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pubblica su GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Senza questo l'action aspetta 10 minuti prima di arrendersi, e il
          # run e' ancora in corso quando arriva il dispatch successivo, che lo
          # annulla. Arrendersi prima le fa anche annullare la deployment invece
          # di lasciarla appesa in "deployment_in_progress" davanti alle altre.
          timeout: 180000
